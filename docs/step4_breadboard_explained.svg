<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="monospace">
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">How a Breadboard Works</text>

  <!-- Breadboard body -->
  <rect x="100" y="50" width="600" height="400" rx="8" fill="#F5F5DC" stroke="#999" stroke-width="2"/>

  <!-- Top power rail (+) -->
  <rect x="120" y="70" width="560" height="30" rx="3" fill="#FFEBEE"/>
  <text x="110" y="90" text-anchor="end" font-size="14" fill="#f44336" font-weight="bold">+</text>
  <!-- Holes in power rail -->
  <g fill="#333">
    <circle cx="140" cy="85" r="3"/><circle cx="160" cy="85" r="3"/><circle cx="180" cy="85" r="3"/>
    <circle cx="200" cy="85" r="3"/><circle cx="220" cy="85" r="3"/><circle cx="240" cy="85" r="3"/>
    <circle cx="260" cy="85" r="3"/><circle cx="280" cy="85" r="3"/><circle cx="300" cy="85" r="3"/>
    <circle cx="320" cy="85" r="3"/><circle cx="340" cy="85" r="3"/><circle cx="360" cy="85" r="3"/>
    <circle cx="380" cy="85" r="3"/><circle cx="400" cy="85" r="3"/><circle cx="420" cy="85" r="3"/>
    <circle cx="440" cy="85" r="3"/><circle cx="460" cy="85" r="3"/><circle cx="480" cy="85" r="3"/>
    <circle cx="500" cy="85" r="3"/><circle cx="520" cy="85" r="3"/><circle cx="540" cy="85" r="3"/>
    <circle cx="560" cy="85" r="3"/><circle cx="580" cy="85" r="3"/><circle cx="600" cy="85" r="3"/>
    <circle cx="620" cy="85" r="3"/><circle cx="640" cy="85" r="3"/><circle cx="660" cy="85" r="3"/>
  </g>
  <!-- Connection line -->
  <line x1="140" y1="85" x2="660" y2="85" stroke="#f44336" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>

  <!-- Top ground rail (-) -->
  <rect x="120" y="105" width="560" height="30" rx="3" fill="#E3F2FD"/>
  <text x="110" y="125" text-anchor="end" font-size="14" fill="#1565C0" font-weight="bold">−</text>
  <g fill="#333">
    <circle cx="140" cy="120" r="3"/><circle cx="160" cy="120" r="3"/><circle cx="180" cy="120" r="3"/>
    <circle cx="200" cy="120" r="3"/><circle cx="220" cy="120" r="3"/><circle cx="240" cy="120" r="3"/>
    <circle cx="260" cy="120" r="3"/><circle cx="280" cy="120" r="3"/><circle cx="300" cy="120" r="3"/>
    <circle cx="320" cy="120" r="3"/><circle cx="340" cy="120" r="3"/><circle cx="360" cy="120" r="3"/>
    <circle cx="380" cy="120" r="3"/><circle cx="400" cy="120" r="3"/><circle cx="420" cy="120" r="3"/>
    <circle cx="440" cy="120" r="3"/><circle cx="460" cy="120" r="3"/><circle cx="480" cy="120" r="3"/>
    <circle cx="500" cy="120" r="3"/><circle cx="520" cy="120" r="3"/><circle cx="540" cy="120" r="3"/>
    <circle cx="560" cy="120" r="3"/><circle cx="580" cy="120" r="3"/><circle cx="600" cy="120" r="3"/>
    <circle cx="620" cy="120" r="3"/><circle cx="640" cy="120" r="3"/><circle cx="660" cy="120" r="3"/>
  </g>
  <line x1="140" y1="120" x2="660" y2="120" stroke="#1565C0" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>

  <!-- Center gap -->
  <rect x="120" y="260" width="560" height="10" rx="2" fill="#DDD"/>
  <text x="400" y="268" text-anchor="middle" font-size="8" fill="#666">CENTER GAP</text>

  <!-- Top component area - showing vertical connections -->
  <!-- Column labels -->
  <text x="160" y="155" text-anchor="middle" font-size="9" fill="#666">a</text>
  <text x="180" y="155" text-anchor="middle" font-size="9" fill="#666">b</text>
  <text x="200" y="155" text-anchor="middle" font-size="9" fill="#666">c</text>
  <text x="220" y="155" text-anchor="middle" font-size="9" fill="#666">d</text>
  <text x="240" y="155" text-anchor="middle" font-size="9" fill="#666">e</text>

  <!-- Row 1 highlighted -->
  <rect x="150" y="162" width="100" height="18" rx="3" fill="#C8E6C9" opacity="0.7"/>
  <circle cx="160" cy="170" r="4" fill="#4CAF50"/><circle cx="180" cy="170" r="4" fill="#4CAF50"/>
  <circle cx="200" cy="170" r="4" fill="#4CAF50"/><circle cx="220" cy="170" r="4" fill="#4CAF50"/>
  <circle cx="240" cy="170" r="4" fill="#4CAF50"/>
  <text x="270" y="174" font-size="10" fill="#4CAF50">← Row 1: all 5 holes connected</text>

  <!-- Row 2 -->
  <rect x="150" y="185" width="100" height="18" rx="3" fill="#FFF9C4" opacity="0.7"/>
  <circle cx="160" cy="193" r="4" fill="#F9A825"/><circle cx="180" cy="193" r="4" fill="#F9A825"/>
  <circle cx="200" cy="193" r="4" fill="#F9A825"/><circle cx="220" cy="193" r="4" fill="#F9A825"/>
  <circle cx="240" cy="193" r="4" fill="#F9A825"/>
  <text x="270" y="197" font-size="10" fill="#F9A825">← Row 2: separate group (not connected to Row 1)</text>

  <!-- Row 3 -->
  <circle cx="160" cy="216" r="4" fill="#666"/><circle cx="180" cy="216" r="4" fill="#666"/>
  <circle cx="200" cy="216" r="4" fill="#666"/><circle cx="220" cy="216" r="4" fill="#666"/>
  <circle cx="240" cy="216" r="4" fill="#666"/>

  <!-- Row 4 -->
  <circle cx="160" cy="239" r="4" fill="#666"/><circle cx="180" cy="239" r="4" fill="#666"/>
  <circle cx="200" cy="239" r="4" fill="#666"/><circle cx="220" cy="239" r="4" fill="#666"/>
  <circle cx="240" cy="239" r="4" fill="#666"/>

  <!-- Bottom component area -->
  <text x="160" y="285" text-anchor="middle" font-size="9" fill="#666">f</text>
  <text x="180" y="285" text-anchor="middle" font-size="9" fill="#666">g</text>
  <text x="200" y="285" text-anchor="middle" font-size="9" fill="#666">h</text>
  <text x="220" y="285" text-anchor="middle" font-size="9" fill="#666">i</text>
  <text x="240" y="285" text-anchor="middle" font-size="9" fill="#666">j</text>

  <circle cx="160" cy="298" r="4" fill="#666"/><circle cx="180" cy="298" r="4" fill="#666"/>
  <circle cx="200" cy="298" r="4" fill="#666"/><circle cx="220" cy="298" r="4" fill="#666"/>
  <circle cx="240" cy="298" r="4" fill="#666"/>

  <circle cx="160" cy="321" r="4" fill="#666"/><circle cx="180" cy="321" r="4" fill="#666"/>
  <circle cx="200" cy="321" r="4" fill="#666"/><circle cx="220" cy="321" r="4" fill="#666"/>
  <circle cx="240" cy="321" r="4" fill="#666"/>

  <!-- Key rules box -->
  <rect x="100" y="460" width="600" height="50" rx="5" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <text x="120" y="480" font-size="12" fill="#333" font-weight="bold">Rules:</text>
  <text x="120" y="498" font-size="11" fill="#555">• Power rails (+/−): connected HORIZONTALLY across the entire row</text>
  <text x="120" y="514" font-size="11" fill="#555">• Component area (a-e, f-j): connected VERTICALLY in groups of 5</text>

  <!-- Vertical connection arrows -->
  <path d="M 160,162 L 160,250" stroke="#4CAF50" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>

  <!-- Big arrow showing vertical connection -->
  <line x1="145" y1="170" x2="145" y2="170" stroke="#4CAF50" stroke-width="2"/>
</svg>
